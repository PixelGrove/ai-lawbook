name: 훅 버그 · Hook bug
description: 주입·guard 훅이 이상하게 동작합니다 · The injection or guard hook misbehaves
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요 · What happened
      description: 세션 시작 상태 메시지("AI 법전: 시행 중 …")가 있으면 붙여 주세요. · Paste the session-start status message if any.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경 · Environment
      placeholder: "OS, bash --version, jq --version, Claude Code 판 · version, ai-lawbook 판 · version"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법 · Steps to reproduce
      description: 명부·장부 내용은 비밀값을 지우고 붙여 주세요. 보안 문제면 SECURITY.md 를 따라 주세요. · Strip secrets from roster or ledger content. For security issues, follow SECURITY.md.
